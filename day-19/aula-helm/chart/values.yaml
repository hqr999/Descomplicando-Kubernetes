deployments:
  giropops-senhas:
    name: "giropops-senhas-helm"
    image: "linuxtips/giropops-senhas:1.0"
    replicas: "4"
    labels:
      app: "giropops-senhas"
      env: "labs"
      live: "true"
    ports:
      - port: 5000
        targetPort: 5000 
        name: "giropops-senhas-port"
        serviceType: "NodePort"
        NodePort: 32500
      - port: 8088
        targetPort: 8088 
        name: "giropops-senhas-metrics"
        serviceType: "ClusterIP"
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
  redis:
   name: "redis-helm"
   image: "redis"
   replicas: 1
   port: 5000
   labels:
     app: "redis"
   resources:
     requests:
       memory: "64Mi"
       cpu: "250m"
     limits:
       memory: "128Mi"
       cpu: "500m"
services:
  giropops-senhas:
    labels:
      app: "giropops-senhas"
      env: "labs"
      live: "true"
    ports:
     - port: 5000
       targetPort: 5000 
       name: "app"
       serviceType: "NodePort"
       NodePort: 32500
     - port: 8088
       targetPort: 8088 
       name: "giropops-senhas-metrics"
       serviceType: "ClusterIP"
  redis:
    labels:
      app: "redis"
      env: "labs"
      live: "true"
    ports:
      - port: 6379
        targetPort: 6379 
        name: "service"
        serviceType: "ClusterIP"
observability:
  giropops-senhas:
    logging: true 
    metrics:
      enabled: true 
      path: "/metrics"
databases:
  giropops-senhas:
    type: "MySQL"
    host: "mysql.svc.clsuer.local"
    port: 3306 
    name: "MyDB"
